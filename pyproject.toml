[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "simple-adp"
version = "0.1.0"
description = "Task-adaptable adaptive architecture search for tabular MLPs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "psutil>=5.9",
  "torch>=2.5",
]

[project.scripts]
simple-adp-benchmark = "simple_adp.benchmark_cli:main"
simple-adp-benchmark-report = "simple_adp.benchmark_report:main"
simple-adp-suite = "simple_adp.runner.launcher:cli_main"
simple-adp-pressure-wrapper = "simple_adp.runner.pressure_wrapper:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
benchmark = ["openml>=0.15", "scikit-learn>=1.5"]
vision = ["torchvision>=0.20"]
physionet = ["wfdb>=4.1"]
odds = ["scipy>=1.13", "h5py>=3.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.hatch.build.targets.wheel]
packages = ["src/simple_adp"]
