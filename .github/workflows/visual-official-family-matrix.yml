name: Official Fashion-MNIST all-controlled-visual-family worker smoke

on:
  push:
    branches: [main]
    paths:
      - 'scripts/visual_official_fashion_matrix.py'
      - 'src/simple_adp/runner/worker.py'
      - 'src/simple_adp/runner/vision.py'
      - 'src/simple_adp/visual_accounting.py'
      - '.github/workflows/visual-official-family-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-matrix-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
      SIMPLE_ADP_DISABLE_GPU_ACCELERATORS: '1'
      TRAINING_CONTROL_CPU_ONLY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official dataset and worker dependencies
        run: python -m pip install -e '.[vision,dev]'
      - name: Run 19 controlled architecture/site policies with fixed and native RR stages
        run: |
          python scripts/visual_official_fashion_matrix.py \
            --workdir "${{ runner.temp }}/official-image-matrix" \
            --train-limit 40 --valid-limit 20 --test-limit 20
      - name: Retain actual official source worker results, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fashion-mnist-all-visual-controlled-workers
          if-no-files-found: warn
          retention-days: 30
          path: |
            ${{ runner.temp }}/official-image-matrix/official_fashion_vision_matrix.json
            ${{ runner.temp }}/official-image-matrix/results/**/result.json
            ${{ runner.temp }}/official-image-matrix/results/**/output.json
            ${{ runner.temp }}/official-image-matrix/results/**/search_history.json
