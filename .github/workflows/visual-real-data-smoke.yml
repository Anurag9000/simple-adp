name: Official pretrained ResNet18 V01 source-data smoke

on:
  push:
    paths:
      - 'scripts/vision_official_smoke.py'
      - '.github/workflows/visual-real-data-smoke.yml'
  workflow_dispatch:
    inputs:
      dataset:
        description: 'Official image dataset (CIFAR explicitly opt-in due slow network)'
        type: choice
        default: fashion_mnist
        required: true
        options:
          - fashion_mnist
          - cifar10
          - cifar100

jobs:
  official-fashion:
    # Fast verified source; CIFAR is not chained to this job.
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dataset == 'fashion_mnist')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[vision]'
      - name: Official Fashion-MNIST and ResNet18 source
        run: python scripts/vision_official_smoke.py --dataset fashion_mnist --workdir "${{ runner.temp }}/vision" --device cpu
      - name: Persist actual signed result and model
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fashion-mnist-official-source-v01
          if-no-files-found: warn
          retention-days: 30
          path: |
            ${{ runner.temp }}/vision/fashion_mnist/resnet18/ADP-W-RR/seed11/manifest.json
            ${{ runner.temp }}/vision/fashion_mnist/resnet18/ADP-W-RR/seed11/result.json
            ${{ runner.temp }}/vision/fashion_mnist/resnet18/ADP-W-RR/seed11/search_history.json
            ${{ runner.temp }}/vision/fashion_mnist/resnet18/ADP-W-RR/seed11/external_source_provenance.json
            ${{ runner.temp }}/vision/fashion_mnist/resnet18/ADP-W-RR/seed11/estimator.model.pt
            ${{ runner.temp }}/vision/fashion_mnist/resnet18/ADP-W-RR/seed11/estimator.model.pt.vision.json

  official-cifar:
    # The official Toronto CIFAR source timed out in cancelled run 41451620431.
    if: github.event_name == 'workflow_dispatch' && (inputs.dataset == 'cifar10' || inputs.dataset == 'cifar100')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[vision]'
      - name: Explicit bounded official CIFAR download
        run: |
          timeout --signal=TERM 420s python scripts/vision_official_smoke.py \
            --dataset "${{ inputs.dataset }}" --workdir "${{ runner.temp }}/vision" --device cpu
      - name: Persist any actually completed signed run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-cifar-resnet18-v01
          if-no-files-found: warn
          retention-days: 30
          path: |
            ${{ runner.temp }}/vision/cifar*/resnet18/ADP-W-RR/seed11/manifest.json
            ${{ runner.temp }}/vision/cifar*/resnet18/ADP-W-RR/seed11/result.json
            ${{ runner.temp }}/vision/cifar*/resnet18/ADP-W-RR/seed11/search_history.json
            ${{ runner.temp }}/vision/cifar*/resnet18/ADP-W-RR/seed11/external_source_provenance.json
            ${{ runner.temp }}/vision/cifar*/resnet18/ADP-W-RR/seed11/estimator.model.pt
            ${{ runner.temp }}/vision/cifar*/resnet18/ADP-W-RR/seed11/estimator.model.pt.vision.json
