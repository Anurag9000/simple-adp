name: Official Fashion-MNIST + ResNet18 real-data V01 smoke

on:
  # Separate from the fully offline 360+ test suite; explicit network access.
  push:
    paths:
      - 'scripts/vision_official_smoke.py'
      - '.github/workflows/visual-real-data-smoke.yml'
  workflow_dispatch:

jobs:
  official-data-frozen-v01:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install native vision requirements
        run: python -m pip install -e '.[vision]'
      - name: Fetch official datasets and pretrained source then run bounded V01 ADP
        run: |
          python scripts/vision_official_smoke.py --workdir "${{ runner.temp }}/real-vision-v01" --dataset fashion_mnist --device cpu
          python scripts/vision_official_smoke.py --workdir "${{ runner.temp }}/real-vision-v01" --dataset cifar10 --device cpu
      - name: Retain actual run manifest and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fashion-mnist-and-cifar10-official-resnet18-v01-evidence
          if-no-files-found: warn
          retention-days: 30
          path: |
            ${{ runner.temp }}/real-vision-v01/fashion_mnist/resnet18/ADP-W-RR/seed11/manifest.json
            ${{ runner.temp }}/real-vision-v01/fashion_mnist/resnet18/ADP-W-RR/seed11/result.json
            ${{ runner.temp }}/real-vision-v01/fashion_mnist/resnet18/ADP-W-RR/seed11/external_source_provenance.json
            ${{ runner.temp }}/real-vision-v01/fashion_mnist/resnet18/ADP-W-RR/seed11/estimator.model.pt
            ${{ runner.temp }}/real-vision-v01/fashion_mnist/resnet18/ADP-W-RR/seed11/estimator.model.pt.vision.json
            ${{ runner.temp }}/real-vision-v01/cifar10/resnet18/ADP-W-RR/seed11/manifest.json
            ${{ runner.temp }}/real-vision-v01/cifar10/resnet18/ADP-W-RR/seed11/result.json
            ${{ runner.temp }}/real-vision-v01/cifar10/resnet18/ADP-W-RR/seed11/external_source_provenance.json
            ${{ runner.temp }}/real-vision-v01/cifar10/resnet18/ADP-W-RR/seed11/estimator.model.pt
            ${{ runner.temp }}/real-vision-v01/cifar10/resnet18/ADP-W-RR/seed11/estimator.model.pt.vision.json
