name: Official CIFAR-10 all-controlled-visual-family worker smoke

on:
  push:
    branches: [main]
    paths:
      - 'scripts/visual_official_fashion_matrix.py'
      - 'scripts/visual_paired_metrics_analysis.py'
      - 'src/simple_adp/visual_paired_metrics.py'
      - 'src/simple_adp/visual_budget_audit.py'
      - '.github/workflows/visual-official-cifar-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-cifar10-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
      SIMPLE_ADP_DISABLE_GPU_ACCELERATORS: '1'
      TRAINING_CONTROL_CPU_ONLY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official image dataset and native runner dependencies
        run: python -m pip install -e '.[vision,dev]'
      - name: Run real RGB CIFAR-10 with controlled fixed/RR native workers
        run: |
          python scripts/visual_official_fashion_matrix.py \
            --dataset cifar10 \
            --workdir "${{ runner.temp }}/official-cifar10-matrix" \
            --train-limit 40 --valid-limit 20 --test-limit 20
      - name: Produce descriptive paired CIFAR-10 accuracy and calibration report
        run: |
          python scripts/visual_paired_metrics_analysis.py \
            --matrix "${{ runner.temp }}/official-cifar10-matrix/official_cifar10_vision_matrix.json" \\
            --results-root "${{ runner.temp }}/official-cifar10-matrix/results"
      - name: Retain official CIFAR-10 worker results and budget audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cifar10-all-visual-controlled-workers
          if-no-files-found: warn
          retention-days: 30
          path: |
            ${{ runner.temp }}/official-cifar10-matrix/official_cifar10_vision_matrix.json
            ${{ runner.temp }}/official-cifar10-matrix/official_cifar10_vision_matrix_paired_metrics.json
            ${{ runner.temp }}/official-cifar10-matrix/results/**/result.json
            ${{ runner.temp }}/official-cifar10-matrix/results/**/output.json
            ${{ runner.temp }}/official-cifar10-matrix/results/**/search_history.json
