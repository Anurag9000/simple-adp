name: Bounded real Iris all 13 native growing ADP methods paired proof
on:
  push:
    branches: [main]
    paths:
      - 'src/simple_adp/registry.py'
      - 'src/simple_adp/growth.py'
      - 'src/simple_adp/shadow_bgd_variance.py'
      - 'scripts/run_bounded_iris_bayesian_pair.py'
      - 'scripts/audit_bounded_iris_all_native.py'
      - '.github/workflows/bounded-iris-all-native.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-and-variance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        model_id:
          - LGND-W-Greedy
          - ADP-W-RR
          - ADP-W-All
          - ADP-WD-RR-D1
          - ADP-WD-All-Dcur
          - ADP-WD-RR-Dcur
          - ADP-WD-All-D1
          - ADP-DW-D1-RR
          - ADP-DW-Dcur-All
          - ADP-DW-Dcur-RR
          - ADP-DW-D1-All
          - ADP-D-D1
          - ADP-D-Dcur
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      SIMPLE_ADP_DISABLE_GPU_ACCELERATORS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU Torch and real sklearn data
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install -e '.[dev]' --no-deps
          python -m pip install numpy pandas psutil 'scikit-learn>=1.5'
      - name: Execute actual paired model search against real Iris observations
        run: |
          python scripts/run_bounded_iris_bayesian_pair.py \
            --seed 73 --model-id ${{ matrix.model_id }} \
            --output benchmark-results/all-native-${{ matrix.model_id }}
      - name: Preserve both model artifacts, two checkpoints and paired receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iris-all-native-${{ matrix.model_id }}-${{ github.sha }}
          path: benchmark-results/all-native-${{ matrix.model_id }}/
          retention-days: 30
          if-no-files-found: warn

  verify-all-native:
    needs: original-and-variance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install receipt-validation dependencies
        run: python -m pip install 'numpy>=1.26'
      - name: Download all 13 source/variance job artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: iris-all-native-*-${{ github.sha }}
          path: benchmark-results/all-native-receipts
      - name: Verify 13 methods and every saved model and checkpoint hash
        run: |
          python -m scripts.audit_bounded_iris_all_native \
            benchmark-results/all-native-receipts/*/pair_receipt.json \
            --output benchmark-results/all-native-13-method-audit.json
      - name: Export verified original-vs-Bayesian model inventory
        uses: actions/upload-artifact@v4
        with:
          name: iris-all-native-13-method-audit-${{ github.sha }}
          path: benchmark-results/all-native-13-method-audit.json
          retention-days: 30
          if-no-files-found: error
