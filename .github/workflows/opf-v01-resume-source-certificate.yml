name: External OPF_ADP V01 journal source certificate

on:
  push:
    branches: [main]
    paths:
      - 'tests/opf_v01_resume_certificate/**'
      - '.github/workflows/opf-v01-resume-source-certificate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  opf-v01-journal-certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      PYTHONPATH: ${{ github.workspace }}/tests/opf_v01_resume_certificate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal isolated CPU dependencies
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch==2.6.0'
          python -m pip install --disable-pip-version-check numpy pytest
      - name: Reject modified source or test snapshots
        run: |
          test "$(git hash-object tests/opf_v01_resume_certificate/vision_adp/v01_resume.py)" = "cd323ad87a97b32b7d045f31a52af539c939af7e"
          test "$(git hash-object tests/opf_v01_resume_certificate/journal_certificate_contracts.py)" = "099f59f5d43644295679699ce72c137b953bc971"
      - name: Compile exact external OPF source snapshot
        run: |
          python -m py_compile tests/opf_v01_resume_certificate/vision_adp/v01_resume.py
          python -m py_compile tests/opf_v01_resume_certificate/journal_certificate_contracts.py
      - name: Execute real crash rollback and scientific-source guards
        run: |
          python -m pytest -q -o addopts='' tests/opf_v01_resume_certificate/journal_certificate_contracts.py
