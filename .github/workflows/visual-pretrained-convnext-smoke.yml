name: Source-faithful pretrained ConvNeXt V04 inner FFN real image smoke

on:
  push:
    paths:
      - 'scripts/vision_pretrained_convnext_smoke.py'
      - '.github/workflows/visual-pretrained-convnext-smoke.yml'
  workflow_dispatch:

jobs:
  real-source-inner-ffn:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source torchvision requirements
        run: python -m pip install -e '.[vision]'
      - name: Download official source and run genuine first CNBlock ADP
        run: |
          python scripts/vision_pretrained_convnext_smoke.py \
            --workdir "${{ runner.temp }}/real-v04" --device cpu
      - name: Retain signed source-FFN metrics, provenance and selected model
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-v04-convnext-source-inner-ffn
          if-no-files-found: warn
          retention-days: 30
          path: |
            ${{ runner.temp }}/real-v04/experiments/fashion_mnist/V04-source/ADP-W-RR/seed11/manifest.json
            ${{ runner.temp }}/real-v04/experiments/fashion_mnist/V04-source/ADP-W-RR/seed11/result.json
            ${{ runner.temp }}/real-v04/experiments/fashion_mnist/V04-source/ADP-W-RR/seed11/search_history.json
            ${{ runner.temp }}/real-v04/experiments/fashion_mnist/V04-source/ADP-W-RR/seed11/selected_source_ffn_model.pt
