name: V01 paired image comparison signed offline contracts

on:
  push:
    paths:
      - 'src/simple_adp/vision_comparison.py'
      - 'src/simple_adp/vision_experiment.py'
      - 'tests/test_vision_comparison.py'
      - '.github/workflows/vision-comparison-contract.yml'
  workflow_dispatch:

jobs:
  paired-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev,vision]'
      - name: Verify paired source/split/criterion identity and crash/relaunch
        run: python -m pytest -q tests/test_vision_comparison.py tests/test_vision_experiment.py tests/test_vision_data.py tests/test_visual_v01.py
