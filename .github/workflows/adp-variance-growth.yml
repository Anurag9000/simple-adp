name: Standalone ADP original-versus-variance contracts
on:
  push:
    branches: [main]
    paths:
      - 'src/simple_adp/**'
      - 'tests/test_shadow_variance_growth_counterparts.py'
      - 'tests/test_shadow_variance_resume_integrity.py'
      - 'tests/test_run_spec_immutable_integrity.py'
      - 'tests/test_bayesian_pair_audit.py'
      - 'tests/test_adapter_growth_capabilities.py'
      - 'tests/test_bounded_iris_paired_analysis.py'
      - 'tests/test_bounded_iris_growth_family_pairs.py'
      - 'tests/test_bounded_iris_all_native_pairs.py'
      - 'scripts/audit_bounded_iris_all_native.py'
      - 'scripts/audit_bounded_iris_growth_families.py'
      - 'tests/test_bounded_diabetes_paired_analysis.py'
      - 'scripts/analyze_bounded_diabetes_pair_results.py'
      - 'scripts/analyze_bounded_iris_pair_results.py'
      - 'tests/test_runner_split_archive_integrity.py'
      - 'tests/test_runner_openml_provider_plan.py'
      - 'tests/test_runner_models.py'
      - 'tests/test_stage_variance_best_epoch_alignment.py'
      - 'tests/test_stage_variance_interrupt_resume.py'
      - 'tests/test_runner_end_to_end.py'
      - '.github/workflows/adp-variance-growth.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-variance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU Torch and project tests
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install -e '.[dev]' --no-deps
          python -m pip install pytest numpy pandas psutil
      - name: Verify matched native ADP training plans and decisions
        run: |
          python -m pytest -q -o addopts='' \
            tests/test_shadow_variance_growth_counterparts.py \
            tests/test_runner_openml_provider_plan.py \
            tests/test_runner_models.py \
            tests/test_stage_variance_best_epoch_alignment.py \
            tests/test_stage_variance_interrupt_resume.py \
            tests/test_runner_end_to_end.py \
            tests/test_shadow_variance_resume_integrity.py \
            tests/test_run_spec_immutable_integrity.py \
            tests/test_bayesian_pair_audit.py \
            tests/test_adapter_growth_capabilities.py \
            tests/test_bounded_iris_paired_analysis.py \
            tests/test_bounded_iris_growth_family_pairs.py \
            tests/test_bounded_iris_all_native_pairs.py \
            tests/test_bounded_diabetes_paired_analysis.py \
            tests/test_runner_split_archive_integrity.py
