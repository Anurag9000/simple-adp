name: Standalone ADP original-versus-variance contracts
on:
  push:
    branches: [main]
    paths: ['src/simple_adp/**', 'tests/test_shadow_variance_growth_counterparts.py', 'tests/test_runner_openml_provider_plan.py', 'tests/test_runner_models.py', '.github/workflows/adp-variance-growth.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-variance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU Torch and project tests
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install -e '.[dev]' --no-deps
          python -m pip install pytest numpy pandas psutil
      - name: Verify matched native ADP training plans and decisions
        run: |
          python -m pytest -q -o addopts='' \
            tests/test_shadow_variance_growth_counterparts.py \
            tests/test_runner_openml_provider_plan.py \
            tests/test_runner_models.py
