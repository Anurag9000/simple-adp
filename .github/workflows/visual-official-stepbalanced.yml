name: Official visual fixed-vs-RR equal optimizer-step budget smoke

on:
  push:
    branches: [main]
    paths:
      - 'scripts/visual_official_fashion_matrix.py'
      - 'scripts/visual_paired_metrics_analysis.py'
      - 'src/simple_adp/visual_paired_metrics.py'
      - '.github/workflows/visual-official-stepbalanced.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-step-balanced-fashion:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
      SIMPLE_ADP_DISABLE_GPU_ACCELERATORS: '1'
      TRAINING_CONTROL_CPU_ONLY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install native visual runner dependencies
        run: python -m pip install -e '.[vision,dev]'
      - name: Run official Fashion fixed two epochs versus native RR two stages
        run: |
          python scripts/visual_official_fashion_matrix.py \
            --dataset fashion_mnist --step-balanced --batch-size 16 \
            --workdir "${{ runner.temp }}/official-visual-stepbalanced" \
            --train-limit 40 --valid-limit 20 --test-limit 20
      - name: Describe paired held-out step-balanced metrics without claiming FLOP parity
        run: |
          python scripts/visual_paired_metrics_analysis.py \
            --matrix "${{ runner.temp }}/official-visual-stepbalanced/official_fashion_vision_matrix_stepbalanced.json" \\
            --results-root "${{ runner.temp }}/official-visual-stepbalanced/results"
      - name: Preserve step-budget evidence, real-image metrics and worker provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fashion-mnist-stepbalanced-visual-workers
          if-no-files-found: warn
          retention-days: 30
          path: |
            ${{ runner.temp }}/official-visual-stepbalanced/official_fashion_vision_matrix_stepbalanced.json
            ${{ runner.temp }}/official-visual-stepbalanced/official_fashion_vision_matrix_stepbalanced_paired_metrics.json
            ${{ runner.temp }}/official-visual-stepbalanced/results/**/result.json
            ${{ runner.temp }}/official-visual-stepbalanced/results/**/output.json
