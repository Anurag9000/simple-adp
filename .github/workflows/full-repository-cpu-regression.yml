name: Whole-repository CPU pytest regression

on:
  push:
    paths:
      - 'src/simple_adp/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/full-repository-cpu-regression.yml'
  workflow_dispatch:

jobs:
  all-tests-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      SIMPLE_ADP_ENABLE_VISION: '0'
      SIMPLE_ADP_ENABLE_V03_SOURCE: '0'
      SIMPLE_ADP_ENABLE_V04_SOURCE: '0'
      SIMPLE_ADP_DISABLE_GPU_ACCELERATORS: '1'
      TRAINING_CONTROL_CPU_ONLY: '1'
      # GitHub /tmp is often a small tmpfs; exact ViT checkpoints need disk-backed space.
      TMPDIR: ${{ runner.temp }}
      TMP: ${{ runner.temp }}
      TEMP: ${{ runner.temp }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Free unused hosted-runner SDK space for exact ViT checkpoints
        run: |
          # Full-source ViT batch-by-batch exact recovery writes large
          # atomic checkpoints. Keep every test; only discard unrelated
          # preinstalled Android/.NET/GHC/PowerShell SDKs on this fresh VM.
          df -h .
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/powershell
          df -h .
      - name: Install all project testing extras
        run: python -m pip install -e '.[dev,vision,benchmark,physionet,odds]'
      - name: Run every repository pytest test, without filtering source modules
        run: |
          df -h "$RUNNER_TEMP" /tmp
          python -m pytest -q --basetemp="$RUNNER_TEMP/simple-adp-full-pytest" tests
      - name: Inspect ephemeral workspace if source-model checkpoint IO fails
        if: failure()
        run: |
          df -h . /tmp "$RUNNER_TEMP"
          du -sh "$RUNNER_TEMP/simple-adp-full-pytest" 2>/dev/null || true
          du -sh /tmp/pytest-of-runner 2>/dev/null || true
