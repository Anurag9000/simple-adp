name: Official visual isolated-process memory and step-balanced worker matrix

on:
  push:
    branches: [main]
    paths:
      - 'scripts/visual_official_fashion_matrix.py'
      - 'scripts/visual_paired_metrics_analysis.py'
      - 'src/simple_adp/visual_paired_metrics.py'
      - 'src/simple_adp/visual_resource_audit.py'
      - '.github/workflows/visual-official-isolated-memory.yml'
  workflow_dispatch:
    inputs:
      dataset:
        description: 'Official image dataset for isolated fixed/RR memory matrix'
        required: true
        default: fashion_mnist
        type: choice
        options:
          - fashion_mnist
          - cifar10
          - cifar100

permissions:
  contents: read

jobs:
  official-fresh-process-memory:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
      SIMPLE_ADP_DISABLE_GPU_ACCELERATORS: '1'
      TRAINING_CONTROL_CPU_ONLY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original visual runner and official image dependencies
        run: python -m pip install -e '.[vision,dev]'
      - name: Run 38 genuine native jobs in fresh processes with balanced-step request
        run: |
          DATASET="${{ inputs.dataset || 'fashion_mnist' }}"
          if [ "$DATASET" = cifar100 ]; then
            LIMITS=(--train-limit 200 --valid-limit 100 --test-limit 100)
          else
            LIMITS=(--train-limit 40 --valid-limit 20 --test-limit 20)
          fi
          python scripts/visual_official_fashion_matrix.py \
            --dataset "$DATASET" \
            --isolated-workers --step-balanced --batch-size 16 \
            --workdir "${{ runner.temp }}/isolated-visual" \
            "${LIMITS[@]}"
      - name: Describe strictly paired held-out effects for fresh-process workers
        run: |
          for matrix in "${{ runner.temp }}/isolated-visual"/official_*_vision_matrix_stepbalanced_isolated.json; do
            test -f "$matrix" || exit 1
            python scripts/visual_paired_metrics_analysis.py --matrix "$matrix" \
              --results-root "${{ runner.temp }}/isolated-visual/results"
          done
      - name: Preserve per-job OS memory observation, split provenance and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-visual-isolated-memory-budget-matrix
          if-no-files-found: warn
          retention-days: 30
          path: |
            ${{ runner.temp }}/isolated-visual/official_*_vision_matrix_stepbalanced_isolated.json
            ${{ runner.temp }}/isolated-visual/official_*_vision_matrix_stepbalanced_isolated_paired_metrics.json
            ${{ runner.temp }}/isolated-visual/results/**/result.json
            ${{ runner.temp }}/isolated-visual/worker_logs/**/*.log
