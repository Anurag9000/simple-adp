name: V04 published-source-compatible coordinated visual runner contracts

on:
  push:
    paths:
      - 'src/simple_adp/runner/vision_source.py'
      - 'src/simple_adp/runner/plugins.py'
      - 'src/simple_adp/runner/plan.py'
      - 'src/simple_adp/runner/worker.py'
      - 'tests/test_runner_vision_source.py'
      - '.github/workflows/visual-source-runner.yml'
  workflow_dispatch:

jobs:
  source-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      SIMPLE_ADP_ENABLE_VISION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev,vision]'
      - name: Verify opt-in identity/pair closure and real source worker
        run: python -m pytest -q --maxfail=1 tests/test_runner_vision_source.py
